<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Text Demo | GSAP Vault</title>
    <script data-cfasync="false">document.documentElement.classList.add('has-js')</script>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="stage" aria-label="Typewriter text demonstration">
        <h1 class="line"
            data-typewriter
            data-type-speed="0.055"
            data-type-delay="0.35"
            data-type-hold="3"
            data-type-delete-speed="0.75"
            data-type-mobile="Read the docs."
            data-type-loop="Edit the code.,Ship it your way."
            data-type-loop-mobile="Edit the code.,Ship it your way.">Read the docs. Edit the code.</h1>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
