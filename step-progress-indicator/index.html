<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Stepper &mdash; GSAP Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* Demo-only toolbar; not part of the component. */
    .showcase-toolbar {
      position: fixed; inset: 0 0 auto 0; z-index: 1000; height: 44px;
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
      flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
      background: var(--ground-2); border-bottom: 1px solid var(--line);
      color: var(--ink-3); font-family: var(--font); font-size: 0.75rem;
      white-space: nowrap;
    }
    .showcase-toolbar::-webkit-scrollbar { display: none; }
    .showcase-toolbar__prompt { color: var(--ink-2); margin-right: auto; }
    .showcase-toolbar__group { display: flex; gap: 2px; padding: 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--raised); }
    .showcase-toolbar button {
      appearance: none; border: 0; cursor: pointer; font: inherit;
      min-height: 26px; padding: 0 9px; border-radius: 4px;
      background: transparent; color: var(--ink-2);
    }
    .showcase-toolbar button:hover { background: var(--hover); color: var(--ink); }
    .showcase-toolbar button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
    .showcase-toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* One row on a phone: the prompt goes so the controls stay on screen. */
    @media (max-width: 560px) {
      .showcase-toolbar__prompt { display: none; }
      .showcase-toolbar { justify-content: flex-end; }
    }
  </style>
</head>
<body data-variant="light">

  <header class="showcase-toolbar">
    <span class="showcase-toolbar__prompt">Move through the flow with Continue and Back, or click a finished step to go back to it.</span>
    <div class="showcase-toolbar__group" role="group" aria-label="Theme">
      <button class="variant-btn" type="button" data-variant="light" aria-pressed="true">Light</button>
      <button class="variant-btn" type="button" data-variant="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <main class="stage">
    <div class="stage__inner">

      <nav class="stepper" id="stepper" aria-label="Account setup progress">
        <div class="stepper-rail" id="stepperRail" aria-hidden="true">
          <div class="stepper-fill" id="stepperFill"></div>
        </div>
        <ol class="stepper-list" id="stepperList">
          <li class="step">
            <button type="button" class="step-node">
              <span class="step-num">1</span>
              <span class="step-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
                  <path class="step-check-path" d="M5 12.5 L10 17.5 L19 7"
                        stroke="currentColor" stroke-width="2.6"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span class="step-node-text">Step 1, Company</span>
            </button>
            <span class="step-label" aria-hidden="true">Company</span>
          </li>
          <li class="step">
            <button type="button" class="step-node">
              <span class="step-num">2</span>
              <span class="step-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
                  <path class="step-check-path" d="M5 12.5 L10 17.5 L19 7"
                        stroke="currentColor" stroke-width="2.6"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span class="step-node-text">Step 2, Bank account</span>
            </button>
            <span class="step-label" aria-hidden="true">Bank account</span>
          </li>
          <li class="step">
            <button type="button" class="step-node">
              <span class="step-num">3</span>
              <span class="step-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
                  <path class="step-check-path" d="M5 12.5 L10 17.5 L19 7"
                        stroke="currentColor" stroke-width="2.6"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span class="step-node-text">Step 3, Template</span>
            </button>
            <span class="step-label" aria-hidden="true">Template</span>
          </li>
          <li class="step">
            <button type="button" class="step-node">
              <span class="step-num">4</span>
              <span class="step-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
                  <path class="step-check-path" d="M5 12.5 L10 17.5 L19 7"
                        stroke="currentColor" stroke-width="2.6"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span class="step-node-text">Step 4, Team</span>
            </button>
            <span class="step-label" aria-hidden="true">Team</span>
          </li>
          <li class="step">
            <button type="button" class="step-node">
              <span class="step-num">5</span>
              <span class="step-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
                  <path class="step-check-path" d="M5 12.5 L10 17.5 L19 7"
                        stroke="currentColor" stroke-width="2.6"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
              <span class="step-node-text">Step 5, Done</span>
            </button>
            <span class="step-label" aria-hidden="true">Done</span>
          </li>
        </ol>
      </nav>

      <p class="stepper-status" id="stepperStatus" role="status" aria-live="polite"></p>

      <div class="demo-controls">
        <button type="button" id="stepBack">Back</button>
        <button type="button" id="stepNext" class="is-primary">Continue</button>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="assets/script.js"></script>
  <script>
    // Demo-only: switches data-variant on <body>; also honours ?variant=name.
    (function () {
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.variant-btn'));
      var names = buttons.map(function (b) { return b.dataset.variant; });
      function setVariant(name) {
        document.body.setAttribute('data-variant', name);
        buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.variant === name)); });
        // The rail is measured, so it re-measures on the resize the switch fires.
        requestAnimationFrame(function () { window.dispatchEvent(new Event('resize')); });
      }
      var wanted = new URLSearchParams(location.search).get('variant');
      var initial = names.indexOf(wanted) > -1 ? wanted : document.body.getAttribute('data-variant') || names[0];
      setVariant(initial);
      buttons.forEach(function (b) { b.addEventListener('click', function () { setVariant(b.dataset.variant); }); });
    })();
  </script>
</body>
</html>
